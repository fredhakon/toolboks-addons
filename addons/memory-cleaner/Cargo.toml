[package]
name = "memory-cleaner"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Memory Cleaner - native Toolboks add-on that shows and trims memory use"

[dependencies]
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
protected-processes.workspace = true
serde_json.workspace = true
sysinfo = "0.40.0"
toolboks-addon-sdk.workspace = true
toolboks-shared.workspace = true

[dev-dependencies]
toolboks-addon-proto.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
