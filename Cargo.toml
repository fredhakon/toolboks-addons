[workspace]
members = ["addons/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "5a1fee118f98b7e6e677836ec64003e5c3589497", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "5a1fee118f98b7e6e677836ec64003e5c3589497" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "5a1fee118f98b7e6e677836ec64003e5c3589497", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "5a1fee118f98b7e6e677836ec64003e5c3589497" }
toolboks-debloat-engine = { git = "https://github.com/Gusseti/toolboks", rev = "5a1fee118f98b7e6e677836ec64003e5c3589497" }
egui = { version = "0.37", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
