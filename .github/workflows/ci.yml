name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Each add-on's integration test uses the pinned host's stdio protocol test host.
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p addon-repo -- validate
      - name: Test release validation
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Build and test all release executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($addon in Get-ChildItem addons -Directory) {
            cargo build --locked --release -p $addon.Name
            if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
            $env:ADDON_TEST_EXE = (Resolve-Path "target/release/$($addon.Name).exe").Path
            cargo test --locked -p $addon.Name --test protocol
            if ($LASTEXITCODE -ne 0) { throw 'Release protocol test failed' }
          }
      - name: Measure Disk Manager pilot
        run: cargo run --locked -p addon-repo -- measure disk-manager
