[workspace]
members = ["addons/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "86c749cbd3a27de920329b512ea8a3f33baca74b", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "86c749cbd3a27de920329b512ea8a3f33baca74b" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "86c749cbd3a27de920329b512ea8a3f33baca74b", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "86c749cbd3a27de920329b512ea8a3f33baca74b" }
egui = { version = "0.37", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
