[workspace]
members = ["addons/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "a96b0ab766648033af8937ac12ed269b58d4bbd7", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "a96b0ab766648033af8937ac12ed269b58d4bbd7" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "a96b0ab766648033af8937ac12ed269b58d4bbd7", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "a96b0ab766648033af8937ac12ed269b58d4bbd7" }
toolboks-debloat-engine = { git = "https://github.com/Gusseti/toolboks", rev = "a96b0ab766648033af8937ac12ed269b58d4bbd7" }
egui = { version = "0.37", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
