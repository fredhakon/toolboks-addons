[workspace]
members = ["addons/*", "crates/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "b99ea9982b505df3d454aa90f18731b895470f5d", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "b99ea9982b505df3d454aa90f18731b895470f5d" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "b99ea9982b505df3d454aa90f18731b895470f5d", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "b99ea9982b505df3d454aa90f18731b895470f5d" }
toolboks-debloat-engine = { git = "https://github.com/Gusseti/toolboks", rev = "b99ea9982b505df3d454aa90f18731b895470f5d" }
egui = { version = "0.37", default-features = false }
serde_json = "1"
protected-processes = { path = "crates/protected-processes" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
