[workspace]
members = ["addons/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "513eedb22e9ed0a60e9a0e4641e11b9a8f0ecd30", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "513eedb22e9ed0a60e9a0e4641e11b9a8f0ecd30" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "513eedb22e9ed0a60e9a0e4641e11b9a8f0ecd30", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "513eedb22e9ed0a60e9a0e4641e11b9a8f0ecd30" }
toolboks-debloat-engine = { git = "https://github.com/Gusseti/toolboks", rev = "513eedb22e9ed0a60e9a0e4641e11b9a8f0ecd30" }
egui = { version = "0.37", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
