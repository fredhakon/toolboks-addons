[workspace]
members = ["addons/*", "crates/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "164a20ff3d0ba0b3f33605bb22fcc1a049bcc54f", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "164a20ff3d0ba0b3f33605bb22fcc1a049bcc54f" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "164a20ff3d0ba0b3f33605bb22fcc1a049bcc54f", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "164a20ff3d0ba0b3f33605bb22fcc1a049bcc54f" }
toolboks-debloat-engine = { git = "https://github.com/Gusseti/toolboks", rev = "164a20ff3d0ba0b3f33605bb22fcc1a049bcc54f" }
egui = { version = "0.37", default-features = false }
serde_json = "1"
protected-processes = { path = "crates/protected-processes" }
boot-perf = { path = "crates/boot-perf" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
