[package]
name = "disk-manager"
version = "0.9.2"
edition = "2021"
license = "MIT"
description = "Disk Manager by stratum - native Toolboks add-on"

[dependencies]
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toolboks-addon-sdk.workspace = true
toolboks-shared.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
toolboks-addon-proto.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_IscsiDisc", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
