[package]
name = "sdk-addon"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "SDK Add-on - writes a new, complete Toolboks add-on project into a folder you choose"

[dependencies]
toolboks-addon-sdk.workspace = true
toolboks-addon-templates.workspace = true
toolboks-shared.workspace = true
egui.workspace = true
serde_json.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
toolboks-addon-sdk = { workspace = true, features = ["testing"] }
toolboks-addon-proto.workspace = true
toolboks-catalog.workspace = true
tempfile = "3.27.0"
