[package]
name = "system-profiles"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "System Profiles - native Toolboks add-on that reviews and applies a Windows gaming profile"

[dependencies]
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toolboks-addon-sdk.workspace = true
toolboks-debloat-engine.workspace = true
toolboks-shared.workspace = true

[dev-dependencies]
toolboks-addon-proto.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
