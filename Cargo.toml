[workspace]
members = ["addons/*", "tools/repo"]
resolver = "2"

[workspace.dependencies]
toolboks-addon-sdk = { git = "https://github.com/Gusseti/toolboks", rev = "5f7c39b04dc367379be0eb9396cfb7362af2ffa3", features = ["runtime"] }
toolboks-addon-proto = { git = "https://github.com/Gusseti/toolboks", rev = "5f7c39b04dc367379be0eb9396cfb7362af2ffa3" }
toolboks-shared = { git = "https://github.com/Gusseti/toolboks", rev = "5f7c39b04dc367379be0eb9396cfb7362af2ffa3", features = ["ui"] }
toolboks-catalog = { git = "https://github.com/Gusseti/toolboks", rev = "5f7c39b04dc367379be0eb9396cfb7362af2ffa3" }
egui = { version = "0.37", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
