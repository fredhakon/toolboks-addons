[package]
name = "pc-checks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only checks for the settings that most often make a PC slow (RAM speed, power plan, throttling, ...)"
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }
